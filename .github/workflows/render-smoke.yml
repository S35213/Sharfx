name: Render test smoke

on:
  push:
    branches:
      - test/rebuild-deriv-native-manual-20260930
  workflow_dispatch:

jobs:
  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Wait for Render test service
        shell: bash
        run: |
          set -euo pipefail
          url="https://sharfx-deriv-render.onrender.com"
          for attempt in $(seq 1 36); do
            status="$(curl -sS -L -o /tmp/shafx-home.html -w '%{http_code}' --max-time 15 "$url/" || true)"
            echo "Attempt $attempt: / -> HTTP $status"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 10
          done

          test -s /tmp/shafx-home.html
          grep -qi '<html' /tmp/shafx-home.html

          auth_status="$(curl -sS -o /tmp/shafx-auth.json -w '%{http_code}' --max-time 15 "$url/api/auth?action=me" || true)"
          echo "Auth probe -> HTTP $auth_status"
          test "$auth_status" = "401"
          node scripts/deriv-public-smoke.mjs
