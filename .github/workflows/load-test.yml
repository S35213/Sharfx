name: SHAFX concurrency load test

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-shafx-load-test]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run production concurrency test
        env:
          SHAFX_LOADTEST_URL: https://shafx.vercel.app
        run: npm run loadtest
