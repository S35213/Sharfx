name: SHAFX concurrency load test

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-shafx-load-test]

permissions:
  contents: read

concurrency:
  group: shafx-load-test-${{ github.workflow }}-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  load-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Upgrade npm for Arborist compatibility
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run explicit-target concurrency test
        env:
          SHAFX_LOADTEST_URL: ${{ vars.SHAFX_LOADTEST_URL }}
        run: |
          test -n "$SHAFX_LOADTEST_URL"
          npm run loadtest
