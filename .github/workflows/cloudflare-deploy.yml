name: Deploy SHAFX to Cloudflare

on:
  push:
    branches:
      - main
      - cloudflare-migration
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: shafx-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        env:
          SHAFX_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          SHAFX_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_WORKERS_ACCOUNT_ID }}
        with:
          apiToken: ${{ env.SHAFX_CF_API_TOKEN }}
          accountId: ${{ env.SHAFX_CF_ACCOUNT_ID }}
          command: deploy

      - name: Publish Cloudflare deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.DEPLOY_STATE,
              context: 'Cloudflare',
              description: process.env.DEPLOY_STATE === 'success'
                ? 'Cloudflare Worker deploy finished.'
                : 'Cloudflare Worker deploy failed.'
            })
