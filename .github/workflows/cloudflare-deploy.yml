name: Deploy SHAFX to Cloudflare

on:
  push:
    branches:
      - main
      - cloudflare-migration
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: shafx-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        id: build
        run: npm run build

      - name: Deploy Worker
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --log-level info 2>&1 | tee /tmp/shafx-cloudflare-deploy.log
          exit ${PIPESTATUS[0]}

      - name: Publish Cloudflare deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const fs = require('fs')
            let tail = ''
            try {
              tail = fs.readFileSync('/tmp/shafx-cloudflare-deploy.log', 'utf8').slice(-1200)
            } catch {}
            const ok = process.env.BUILD_OUTCOME === 'success' && process.env.DEPLOY_OUTCOME === 'success'
            const cleanTail = tail.replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim()
            const description = [
              `build=${process.env.BUILD_OUTCOME || 'unknown'}`,
              `deploy=${process.env.DEPLOY_OUTCOME || 'not-run'}`,
              cleanTail ? `log=${cleanTail.slice(-900)}` : ''
            ].filter(Boolean).join('; ')
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'Cloudflare',
              description: description.slice(0, 140)
            })

      - name: Fail workflow when Cloudflare deployment did not succeed
        if: steps.build.outcome != 'success' || steps.deploy.outcome != 'success'
        run: exit 1
