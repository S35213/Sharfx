name: Deploy SHAFX to Cloudflare

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shafx-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' "$CLOUDFLARE_API_TOKEN" > /tmp/shafx-cf-token
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" > /tmp/shafx-cf-account
          test -s /tmp/shafx-cf-token
          test -s /tmp/shafx-cf-account

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$(cat /tmp/shafx-cf-token)"
          export CLOUDFLARE_ACCOUNT_ID="$(cat /tmp/shafx-cf-account)"
          npx wrangler deploy
