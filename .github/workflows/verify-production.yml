name: Verify SHAFX production deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify deployed marker on production host
        env:
          MARKER: SHAFX-PRODUCTION-LIVE-DATA-FIX-2026-09-26
        run: |
          set -euo pipefail
          hosts=(
            "https://x.150sharingan2.workers.dev"
            "https://sharfx.150sharingan2.workers.dev"
          )
          found=0
          for attempt in $(seq 1 60); do
            found=0
            for host in "${hosts[@]}"; do
              echo "Checking $host (attempt $attempt/60)"
              body="$(curl -fsSL --max-time 15 --retry 2 --retry-delay 2 "$host/shafx-deployment.txt?cachebust=$GITHUB_SHA" || true)"
              if [ "$body" = "$MARKER" ]; then
                echo "Production marker is live at $host"
                found=1
              else
                echo "Marker not present at $host"
              fi
            done
            if [ "$found" -eq 1 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Neither candidate production host served the expected deployed marker within 10 minutes."
          exit 1
