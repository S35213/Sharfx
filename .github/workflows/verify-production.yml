name: Verify SHAFX production deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for the Cloudflare production marker
        env:
          MARKER: SHAFX-PRODUCTION-LIVE-DATA-FIX-2026-09-26
        run: |
          set -euo pipefail
          hosts=(
            "https://x.150sharingan2.workers.dev"
            "https://sharfx.150sharingan2.workers.dev"
          )

          for attempt in $(seq 1 60); do
            for host in "${hosts[@]}"; do
              echo "Attempt $attempt/60: checking $host"
              body="$(curl -fsSL --max-time 15 --retry 2 --retry-delay 2 "$host/shafx-deployment.txt?cachebust=$GITHUB_SHA" || true)"
              if [ "$body" = "$MARKER" ]; then
                echo "Production marker is live at $host"
                exit 0
              fi
            done
            sleep 10
          done

          echo "Cloudflare production did not serve the expected marker within 10 minutes."
          exit 1

      - name: Verify Deriv public market stream
        run: |
          node <<'NODE'
          const url = 'wss://ws.binaryws.com/websockets/v3'
          const ws = new WebSocket(url)
          let candleOk = false
          let tickOk = false
          let finished = false
          const fail = (message) => {
            if (finished) return
            finished = true
            try { ws.close() } catch {}
            console.error(message)
            process.exit(1)
          }
          const succeed = () => {
            if (finished) return
            if (!candleOk || !tickOk) return
            finished = true
            console.log('Deriv public market stream returned candles and a live EUR/USD tick.')
            try { ws.close() } catch {}
            process.exit(0)
          }
          const timeout = setTimeout(() => fail('Timed out waiting for Deriv market data.'), 20000)
          ws.addEventListener('open', () => {
            ws.send(JSON.stringify({
              ticks_history: 'frxEURUSD',
              end: 'latest',
              count: 10,
              style: 'candles',
              granularity: 60,
              subscribe: 0,
              req_id: 101,
            }))
            ws.send(JSON.stringify({
              ticks: 'frxEURUSD',
              subscribe: 1,
              req_id: 102,
            }))
          })
          ws.addEventListener('message', (event) => {
            try {
              const data = JSON.parse(String(event.data))
              if (data.error?.message) fail('Deriv returned an API error: ' + data.error.message)
              if (data.msg_type === 'candles' && Array.isArray(data.candles) && data.candles.length > 0) {
                candleOk = true
                console.log('Received candle history.')
              }
              if (data.msg_type === 'tick' && Number.isFinite(Number(data.tick?.quote)) && Number(data.tick.quote) > 0) {
                tickOk = true
                console.log('Received EUR/USD live quote: ' + data.tick.quote)
              }
              succeed()
            } catch (error) {
              fail(error instanceof Error ? error.message : 'Invalid Deriv WebSocket message.')
            }
          })
          ws.addEventListener('error', () => fail('Deriv public market WebSocket connection failed.'))
          ws.addEventListener('close', () => {
            if (!finished && (!candleOk || !tickOk)) fail('Deriv WebSocket closed before the required market data arrived.')
          })
          process.on('exit', () => clearTimeout(timeout))
          NODE
