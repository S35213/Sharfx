name: Cloudflare production smoke verification

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare Workers production deployment
        env:
          MARKER: SHAFX-PRODUCTION-LIVE-DATA-FIX-2026-09-26
          URL: https://x.150sharingan2.workers.dev/shafx-deployment.txt
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body="$(curl -fsSL --max-time 15 --retry 2 --retry-delay 2 "$URL?cachebust=$GITHUB_SHA" || true)"
            if [ "$body" = "$MARKER" ]; then
              echo "Cloudflare production is serving the expected SHAFX build marker."
              exit 0
            fi
            echo "Cloudflare deployment not visible yet (attempt $attempt/60)."
            sleep 10
          done
          echo "Cloudflare production did not serve the expected build marker within 10 minutes."
          exit 1
