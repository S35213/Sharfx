name: SHAFX authenticated quota load test

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-shafx-auth-load-test]

permissions:
  contents: read

concurrency:
  group: shafx-auth-load-test-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  auth-load-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Upgrade npm for Arborist compatibility
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run authenticated quota concurrency test
        env:
          SHAFX_LOADTEST_URL: ${{ vars.SHAFX_LOADTEST_URL }}
          SHAFX_TEST_EMAIL: ${{ secrets.SHAFX_TEST_EMAIL }}
          SHAFX_TEST_PASSWORD: ${{ secrets.SHAFX_TEST_PASSWORD }}
        run: |
          test -n "$SHAFX_LOADTEST_URL"
          node scripts/auth-load-test.mjs
