name: Provider Architecture CI

on:
  push:
    branches:
      - main
      - feature/provider-agnostic-integrations
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable npm version
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, build, lint and test
        run: |
          npm run build
          npm run lint
          npm test
