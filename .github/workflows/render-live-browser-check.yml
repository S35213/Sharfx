name: Render live browser check
# Live retest after cTrader verified-spec cache fix deployment.
# Sanitized cTrader contract fields captured after the Trade Bot specification blocker.
# QA rerun after cTrader instrument fallback deployment on 2026-10-16.

on:
  push:
    branches:
      - qa/render-live-browser-main-pr-20261016
    paths:
      - .github/workflows/render-live-browser-check.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/render-live-browser-check.yml

permissions:
  contents: read

jobs:
  capture-live-render:
    environment: shafx-live-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated QA branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Chromium automation
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Capture the actual deployed Render page
        env:
          TARGET_URL: https://sharfx-deriv-render.onrender.com/
          SHAFX_QA_EMAIL: ${{ secrets.SHAFX_QA_EMAIL }}
          SHAFX_QA_PASSWORD: ${{ secrets.SHAFX_QA_PASSWORD }}
        run: |
          mkdir -p qa-results
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const targetUrl = process.env.TARGET_URL;
          const report = {
            targetUrl,
            capturedAt: new Date().toISOString(),
            note: 'Uses dedicated GitHub environment secrets. Signal Bot is checked for manual-only scans. Trade Bot order submission is intercepted in-browser as dry-run QA; no broker trade is submitted.',
            viewports: [],
          };

          const configurations = [
            { name: 'desktop', viewport: { width: 1440, height: 1000 }, isMobile: false, hasTouch: false },
            { name: 'mobile', viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true },
          ];

          const browser = await chromium.launch({ headless: true });
          let hasFatalIssue = false;

          try {
            for (const config of configurations) {
              const context = await browser.newContext({
                viewport: config.viewport,
                deviceScaleFactor: 1,
                isMobile: config.isMobile,
                hasTouch: config.hasTouch,
              });
              const page = await context.newPage();
              const blockedDemoOrderRequests = [];
              // Dry-run safety rail: prove the Trade Bot reaches its order-submit path,
              // but reject every placeOrder in Playwright before it reaches Render/cTrader.
              await page.route('**/api/providers/ctrader', async (route) => {
                let requestBody = {};
                try { requestBody = route.request().postDataJSON() || {}; } catch {}
                if (requestBody?.action === 'placeOrder') {
                  const order = requestBody?.order && typeof requestBody.order === 'object' ? requestBody.order : {};
                  blockedDemoOrderRequests.push({
                    symbol: typeof order.symbol === 'string' ? order.symbol : null,
                    side: typeof order.side === 'string' ? order.side : null,
                    interceptedBeforeNetwork: true,
                  });
                  await route.fulfill({ status: 409, contentType: 'application/json',
                    body: JSON.stringify({ ok: false, error: 'QA dry-run intercepted this demo order; no broker order was submitted.' }) });
                  return;
                }
                await route.continue();
              });
              const cTraderInstrumentResponses = [];
              page.on('response', async (response) => {
                try {
                  if (!response.url().includes('/api/providers/ctrader')) return;
                  const requestBody = response.request().postDataJSON();
                  if (requestBody?.action !== 'instruments') return;
                  const payload = await response.json();
                  const instruments = Array.isArray(payload?.instruments) ? payload.instruments : [];
                  cTraderInstrumentResponses.push({
                    status: response.status(),
                    requestedSymbol: typeof requestBody.symbol === 'string' ? requestBody.symbol : null,
                    ok: payload?.ok === true,
                    error: typeof payload?.error === 'string' ? payload.error.slice(0, 300) : null,
                    instruments: instruments.slice(0, 3).map((item) => ({
                      symbol: typeof item?.symbol === 'string' ? item.symbol : null,
                      providerSymbol: typeof item?.providerSymbol === 'string' ? item.providerSymbol : null,
                      tradable: typeof item?.tradable === 'boolean' ? item.tradable : null,
                      contractSize: Number.isFinite(Number(item?.contractSize)) ? Number(item.contractSize) : null,
                      pipSize: Number.isFinite(Number(item?.pipSize)) ? Number(item.pipSize) : null,
                      quantityMin: Number.isFinite(Number(item?.quantityMin)) ? Number(item.quantityMin) : null,
                      quantityMax: Number.isFinite(Number(item?.quantityMax)) ? Number(item.quantityMax) : null,
                      quantityStep: Number.isFinite(Number(item?.quantityStep)) ? Number(item.quantityStep) : null,
                      priceIncrement: Number.isFinite(Number(item?.priceIncrement)) ? Number(item.priceIncrement) : null,
                      metadata: item?.metadata && typeof item.metadata === 'object' ? {
                        symbolId: typeof item.metadata.symbolId === 'string' ? item.metadata.symbolId : null,
                        lotSizeProtocol: typeof item.metadata.lotSizeProtocol === 'string' ? item.metadata.lotSizeProtocol : null,
                        minVolumeProtocol: typeof item.metadata.minVolumeProtocol === 'string' ? item.metadata.minVolumeProtocol : null,
                        maxVolumeProtocol: typeof item.metadata.maxVolumeProtocol === 'string' ? item.metadata.maxVolumeProtocol : null,
                        stepVolumeProtocol: typeof item.metadata.stepVolumeProtocol === 'string' ? item.metadata.stepVolumeProtocol : null,
                        digits: typeof item.metadata.digits === 'string' ? item.metadata.digits : null,
                        pipPosition: typeof item.metadata.pipPosition === 'string' ? item.metadata.pipPosition : null,
                      } : null,
                    })),
                  });
                } catch {
                  // Ignore non-JSON, unrelated, or already-consumed responses.
                }
              });
              const browserErrors = [];
              const failedRequests = [];
              const badResponses = [];
              const pageErrors = [];

              page.on('console', (message) => {
                if (message.type() === 'error') {
                  browserErrors.push({ type: 'console', text: message.text().slice(0, 1200) });
                }
              });
              page.on('pageerror', (error) => {
                pageErrors.push(String(error?.stack || error).slice(0, 2000));
              });
              page.on('requestfailed', (request) => {
                failedRequests.push({
                  url: request.url(),
                  method: request.method(),
                  error: request.failure()?.errorText ?? 'unknown request failure',
                });
              });
              page.on('response', (response) => {
                if (response.status() >= 400) {
                  badResponses.push({
                    status: response.status(),
                    url: response.url(),
                    resourceType: response.request().resourceType(),
                  });
                }
              });

              let navigationStatus = null;
              let navigationError = null;
              try {
                // Render's free service can return a temporary 503 while the instance wakes up.
                // Retry actual navigation before deciding the deployed app is unavailable.
                let response = null;
                for (let attempt = 0; attempt < 5; attempt += 1) {
                  response = await page.goto(targetUrl, {
                    waitUntil: 'domcontentloaded',
                    timeout: 90000,
                  }).catch((error) => {
                    navigationError = String(error?.stack || error).slice(0, 1200);
                    return null;
                  });
                  navigationStatus = response?.status() ?? null;
                  if (navigationStatus !== null && navigationStatus < 500) {
                    navigationError = null;
                    break;
                  }
                  await page.waitForTimeout(5000 + attempt * 3000);
                }
                if (navigationStatus === null || navigationStatus >= 500) {
                  throw new Error(`Render page unavailable after wake-up retries (HTTP ${navigationStatus ?? 'no response'}).`);
                }
                // Allow the client app to hydrate and render, without requiring WebSocket/network idle.
                await page.waitForTimeout(5000);

                const email = process.env.SHAFX_QA_EMAIL;
                const password = process.env.SHAFX_QA_PASSWORD;
                if (!email || !password) throw new Error('QA login secrets are missing from the shafx-live-qa GitHub environment.');

                // PublicWelcome opens the login form from the welcome screen.
                const loginTab = page.getByRole('button', { name: /^Login$/i });
                if (await loginTab.count() && await loginTab.first().isVisible().catch(() => false)) {
                  await loginTab.first().click();
                }
                const emailField = page.getByPlaceholder('Email address').first();
                await emailField.waitFor({ state: 'visible', timeout: 20000 });
                await emailField.fill(email);
                const passwordField = page.getByPlaceholder('Password', { exact: true }).first();
                await passwordField.fill(password);
                await page.getByRole('button', { name: /Login to SHARFX/i }).click();
                await page.waitForTimeout(8000);
                const postLoginText = await page.locator('body').innerText().catch(() => '');
                const authFailure = /invalid login credentials|invalid email or password|email not confirmed|too many requests|sign in failed/i.test(postLoginText);
                report.authentication = {
                  attempted: true,
                  signedIn: !/Welcome to SHARFX|Login to SHARFX|Sign in with your email and password/i.test(postLoginText) && !authFailure,
                  visibleAuthError: authFailure ? postLoginText.match(/.{0,100}(?:invalid login credentials|invalid email or password|email not confirmed|too many requests|sign in failed).{0,160}/i)?.[0] : null,
                };
                if (!report.authentication.signedIn) throw new Error('QA browser did not reach the signed-in workspace. See authentication diagnostics; credentials are not printed.');


                // Actively test the real chart controls before navigating to Bots.
                // Store observed state and network outcomes after each interaction.
                const interactionReport = {
                  startingUrl: page.url(),
                  initialSymbol: null,
                  marketChanges: [],
                  timeframeChecks: [],
                  chartElementSnapshots: [],
                  signalScan: {},
                };
                const nav = page.locator('header.shafx-top-nav');
                interactionReport.initialSymbol = (await nav.innerText().catch(() => '')).split('\n').slice(0, 6).join(' | ');

                const readChartState = async (requestedTimeframe) => {
                  const activeTimeframe = await page.locator('.shafx-timeframe-bar button[aria-pressed="true"]').allTextContents().catch(() => []);
                  const chartInfo = await page.locator('.shafx-chart-stage').evaluate((element) => {
                    const rect = element.getBoundingClientRect();
                    const canvases = Array.from(element.querySelectorAll('canvas')).map((canvas) => ({
                      width: canvas.width,
                      height: canvas.height,
                      cssWidth: Math.round(canvas.getBoundingClientRect().width),
                      cssHeight: Math.round(canvas.getBoundingClientRect().height),
                    }));
                    return {
                      width: Math.round(rect.width),
                      height: Math.round(rect.height),
                      openPositions: element.getAttribute('data-shafx-open-position-count'),
                      matchedOpenPositions: element.getAttribute('data-shafx-matched-open-position-count'),
                      tradeLineCount: element.getAttribute('data-shafx-trade-line-count'),
                      canvases,
                    };
                  }).catch((error) => ({ error: String(error).slice(0, 300) }));
                  const body = await page.locator('body').innerText().catch(() => '');
                  return {
                    requestedTimeframe,
                    activeTimeframe: activeTimeframe.join(','),
                    selectedMarketHeader: (await nav.innerText().catch(() => '')).split('\n').slice(0, 5).join(' | '),
                    chartInfo,
                    waitingForCandles: /Waiting for the live market stream/i.test(body),
                    currentVisiblePrice: (body.match(/(?:EUR\/USD|GBP\/USD|USD\/JPY|USD\/CHF|AUD\/USD|USD\/CAD|NZD\/USD|XAU\/USD)\s+([0-9]+\.[0-9]+)/) || [])[1] ?? null,
                    visibleStatusText: body.match(/(?:LIVE|WAITING|SCANNING|DATA READY|PARTIAL DATA|UNAVAILABLE|DATA ERROR)/g)?.slice(0, 10) ?? [],
                  };
                };

                // Change from EUR/USD to GBP/USD and back so we verify symbol selection in both directions.
                for (const market of ['GBP/USD', 'EUR/USD']) {
                  try {
                    const marketToggle = nav.getByRole('button').first();
                    await marketToggle.click({ timeout: 7000 });
                    const search = page.getByPlaceholder(/Search Deriv symbol/i).first();
                    await search.waitFor({ state: 'visible', timeout: 7000 });
                    await search.fill(market);
                    const marketOption = page.getByRole('button', { name: new RegExp(market.replace('/', '\\/')) }).last();
                    await marketOption.waitFor({ state: 'visible', timeout: 7000 });
                    await marketOption.click();
                    await page.waitForTimeout(4500);
                    const headerText = await nav.innerText().catch(() => '');
                    interactionReport.marketChanges.push({
                      requestedMarket: market,
                      confirmedInHeader: headerText.includes(market),
                      headerText: headerText.split('\n').slice(0, 6).join(' | '),
                      chart: await readChartState(null),
                    });
                  } catch (error) {
                    interactionReport.marketChanges.push({ requestedMarket: market, error: String(error?.stack || error).slice(0, 800) });
                  }
                }

                // Exercise the eight supported timeframes one by one and record the active selection and chart dimensions.
                for (const tf of ['M1', 'M5', 'M15', 'M30', 'H1', 'H4', 'D1', 'W1']) {
                  try {
                    const control = page.locator('.shafx-timeframe-bar').getByRole('button', { name: tf, exact: true });
                    await control.waitFor({ state: 'visible', timeout: 7000 });
                    await control.click();
                    await page.waitForTimeout(3500);
                    const state = await readChartState(tf);
                    state.selectedCorrectly = state.activeTimeframe.split(',').includes(tf);
                    interactionReport.timeframeChecks.push(state);
                  } catch (error) {
                    interactionReport.timeframeChecks.push({ requestedTimeframe: tf, error: String(error?.stack || error).slice(0, 800) });
                  }
                }

                // Capture the actual UI after all timeframe changes, then open Bots.
                // Open the actual Bot workspace using the real navigation controls:
                // desktop's workspace rail and mobile's fixed bottom navigation both label it "Bots".
                const botsNav = config.isMobile
                  ? page.getByRole('navigation', { name: 'Terminal navigation' }).getByRole('button', { name: 'Bots', exact: true }).first()
                  : page.getByRole('button', { name: 'Bots', exact: true }).first();
                let botsOpened = false;
                if (await botsNav.count() && await botsNav.isVisible().catch(() => false)) {
                  await botsNav.click();
                  await page.waitForTimeout(5000);
                  botsOpened = true;
                }
                const botWorkspaceText = await page.locator('body').innerText().catch(() => '');

                // Wait for the Signal Bot scan control to become actionable, click it,
                // and inspect the transient scanning state as well as the returned state.
                const scanButton = page.getByRole('button', { name: /Scan all timeframes now|Retry full scan|Scanning all 8 timeframes/i }).first();
                // The scanner must be idle until the user clicks. Wait longer than
                // the removed 15-second loop and compare scan number/timestamp.
                interactionReport.signalScan.idleBeforeClick = {
                  buttonText: await scanButton.innerText().catch(() => ''),
                  enabled: !(await scanButton.isDisabled().catch(() => true)),
                };
                const idleBeforeBody = await page.locator('body').innerText().catch(() => '');
                const idleBeforeScanNumber = (idleBeforeBody.match(/Scan #(\d+)/i) || [])[1] ?? null;
                const idleBeforeFinishedAt = (idleBeforeBody.match(/Last scan finished\s+([^\n]+)/i) || [])[1] ?? null;
                await page.waitForTimeout(17_000);
                const idleAfterBody = await page.locator('body').innerText().catch(() => '');
                const idleAfterScanNumber = (idleAfterBody.match(/Scan #(\d+)/i) || [])[1] ?? null;
                const idleAfterFinishedAt = (idleAfterBody.match(/Last scan finished\s+([^\n]+)/i) || [])[1] ?? null;
                interactionReport.signalScan.idleOnlyUntilManualClick = {
                  beforeScanNumber: idleBeforeScanNumber,
                  afterScanNumber: idleAfterScanNumber,
                  beforeFinishedAt: idleBeforeFinishedAt,
                  afterFinishedAt: idleAfterFinishedAt,
                  noScanningState: !/Scanning all 8 timeframes|Scanning M1, M5, M15, M30, H1, H4, D1 and W1/i.test(idleAfterBody),
                  passed: idleBeforeScanNumber === idleAfterScanNumber && idleBeforeFinishedAt === idleAfterFinishedAt &&
                    !/Scanning all 8 timeframes|Scanning M1, M5, M15, M30, H1, H4, D1 and W1/i.test(idleAfterBody),
                };
                if (!interactionReport.signalScan.idleOnlyUntilManualClick.passed) hasFatalIssue = true;
                const scanWaitStarted = Date.now();
                try {
                  await scanButton.waitFor({ state: 'visible', timeout: 12000 });
                  while (await scanButton.isDisabled().catch(() => true) && Date.now() - scanWaitStarted < 45000) {
                    await page.waitForTimeout(1500);
                  }
                  interactionReport.signalScan.buttonTextBefore = await scanButton.innerText().catch(() => '');
                  interactionReport.signalScan.enabledBefore = !(await scanButton.isDisabled().catch(() => true));
                  if (interactionReport.signalScan.enabledBefore) {
                    await scanButton.click();
                    await page.waitForTimeout(1200);
                    const bodyDuringScan = await page.locator('body').innerText().catch(() => '');
                    interactionReport.signalScan.visibleDuringScan = {
                      scanningButton: /Scanning all 8 timeframes/i.test(await scanButton.innerText().catch(() => '')),
                      scanningTimeframes: (bodyDuringScan.match(/\b(?:M1|M5|M15|M30|H1|H4|D1|W1)\s+SCAN\b/g) || []),
                      loadingMessage: /Scanning M1, M5, M15, M30, H1, H4, D1 and W1/i.test(bodyDuringScan),
                    };
                    interactionReport.signalScan.progressSamples = [];
                    let elapsedAfterClick = 0;
                    while (elapsedAfterClick < 60000 && await scanButton.isDisabled().catch(() => false)) {
                      await page.waitForTimeout(3000);
                      elapsedAfterClick += 3000;
                      const progressBody = await page.locator('body').innerText().catch(() => '');
                      interactionReport.signalScan.progressSamples.push({
                        elapsedMs: elapsedAfterClick,
                        buttonText: await scanButton.innerText().catch(() => ''),
                        ready: (progressBody.match(/\b(?:M1|M5|M15|M30|H1|H4|D1|W1)\s+OK\b/g) || []).length,
                        scanning: (progressBody.match(/\b(?:M1|M5|M15|M30|H1|H4|D1|W1)\s+SCAN\b/g) || []).length,
                        waiting: (progressBody.match(/\b(?:M1|M5|M15|M30|H1|H4|D1|W1)\s+WAIT\b/g) || []).length,
                      });
                    }
                    interactionReport.signalScan.waitedForCompletionMs = elapsedAfterClick;
                    interactionReport.signalScan.completedWithinTimeout = !(await scanButton.isDisabled().catch(() => true));
                    const bodyAfterScan = await page.locator('body').innerText().catch(() => '');
                    interactionReport.signalScan.buttonTextAfter = await scanButton.innerText().catch(() => '');
                    interactionReport.signalScan.visibleAfterScan = {
                      scanningButton: /Scanning all 8 timeframes/i.test(await scanButton.innerText().catch(() => '')),
                      timeframeReadyRows: (bodyAfterScan.match(/\b(?:M1|M5|M15|M30|H1|H4|D1|W1)\s+OK\b/g) || []),
                      timeframeScanningRows: (bodyAfterScan.match(/\b(?:M1|M5|M15|M30|H1|H4|D1|W1)\s+SCAN\b/g) || []),
                      timeframeWaitingRows: (bodyAfterScan.match(/\b(?:M1|M5|M15|M30|H1|H4|D1|W1)\s+WAIT\b/g) || []),
                      hasLatestCandleClose: !/LATEST CANDLE CLOSE\s+—/i.test(bodyAfterScan),
                      hasScanFinishedTimestamp: !/Last scan finished\s+—/i.test(bodyAfterScan),
                      scanText: bodyAfterScan.split('\n').filter((line) => /Scan #|DATA READY|PARTIAL DATA|SCANNING|DATA ERROR|UNAVAILABLE|last scan finished|Latest candle close|cTrader returned/i.test(line)).slice(0, 40),
                    };
                    const completedScanNumber = (bodyAfterScan.match(/Scan #(\d+)/i) || [])[1] ?? null;
                    const completedScanAt = (bodyAfterScan.match(/Last scan finished\s+([^\n]+)/i) || [])[1] ?? null;
                    await page.waitForTimeout(17_000);
                    const postCooldownBody = await page.locator('body').innerText().catch(() => '');
                    const postCooldownScanNumber = (postCooldownBody.match(/Scan #(\d+)/i) || [])[1] ?? null;
                    const postCooldownFinishedAt = (postCooldownBody.match(/Last scan finished\s+([^\n]+)/i) || [])[1] ?? null;
                    interactionReport.signalScan.noAutomaticRescanAfterClick = {
                      scanNumberBeforeCooldown: completedScanNumber,
                      scanNumberAfterCooldown: postCooldownScanNumber,
                      finishedAtBeforeCooldown: completedScanAt,
                      finishedAtAfterCooldown: postCooldownFinishedAt,
                      noScanningState: !/Scanning all 8 timeframes|Scanning M1, M5, M15, M30, H1, H4, D1 and W1/i.test(postCooldownBody),
                      passed: completedScanNumber === postCooldownScanNumber && completedScanAt === postCooldownFinishedAt &&
                        !/Scanning all 8 timeframes|Scanning M1, M5, M15, M30, H1, H4, D1 and W1/i.test(postCooldownBody),
                    };
                    if (!interactionReport.signalScan.noAutomaticRescanAfterClick.passed) hasFatalIssue = true;
                  } else {
                    interactionReport.signalScan.note = 'Scan button stayed disabled while browser waited up to 45 seconds; exact displayed state recorded.';
                  }
                } catch (error) {
                  interactionReport.signalScan.error = String(error?.stack || error).slice(0, 1000);
                }

                // Click Run behind the local placeOrder interceptor. This exercises
                // actual market cycles and risk gates without submitting a broker order.
                interactionReport.tradeBotRun = {};
                const startDemoBotButton = page.getByRole('button', { name: /Start demo bot/i }).first();
                try {
                  interactionReport.tradeBotRun.startButtonVisible = await startDemoBotButton.isVisible().catch(() => false);
                  interactionReport.tradeBotRun.startButtonEnabled = !(await startDemoBotButton.isDisabled().catch(() => true));
                  if (interactionReport.tradeBotRun.startButtonVisible && interactionReport.tradeBotRun.startButtonEnabled) {
                    await startDemoBotButton.click();
                    interactionReport.tradeBotRun.clickedStart = true;
                    try {
                      await page.waitForFunction(() => {
                        const body = document.body.innerText || '';
                        return /Cycle \d+:|no demo order sent|DEMO ORDER FILLED|Fetching a fresh cTrader history snapshot/i.test(body);
                      }, null, { timeout: 45_000 });
                    } catch {}
                    const botBody = await page.locator('body').innerText().catch(() => '');
                    interactionReport.tradeBotRun.completedCycleObserved = /Cycle \d+:/.test(botBody);
                    interactionReport.tradeBotRun.activityText = botBody.split('\n').filter((line) =>
                      /SHAFX Trade Bot|MONITORING|LOADING|PARTIAL DATA|BLOCKED|Cycle \d+:|Fetching a fresh cTrader|DEMO ORDER FILLED|no demo order sent|SETUP READY/i.test(line),
                    ).slice(-32);
                    interactionReport.tradeBotRun.interceptedOrderCount = blockedDemoOrderRequests.length;
                    interactionReport.tradeBotRun.interceptedOrders = blockedDemoOrderRequests;
                    const stopButton = page.getByRole('button', { name: /Stop bot/i }).first();
                    if (await stopButton.isVisible().catch(() => false)) await stopButton.click();
                    interactionReport.tradeBotRun.stoppedAfterCheck = true;
                  } else {
                    interactionReport.tradeBotRun.note = 'Start demo bot was unavailable or blocked; no gate was bypassed.';
                  }
                } catch (error) {
                  interactionReport.tradeBotRun.error = String(error?.stack || error).slice(0, 1000);
                }
                interactionReport.blockedDemoOrderRequests = blockedDemoOrderRequests;
                interactionReport.tradeBotRuntimeProps = await page.locator('section').filter({ hasText: 'SHAFX Trade Bot' }).evaluateAll((sections) => sections.slice(0, 4).map((element) => {
                  const fiberKey = Object.keys(element).find((key) => key.includes('reactFiber'));
                  if (!fiberKey) return { fiberFound: false };
                  let fiber = element[fiberKey];
                  let panelProps = null;
                  let panelConnectionId = null;
                  let panelAccountId = null;
                  let appSpecState = null;
                  let stateOwner = null;
                  let guard = 0;
                  while (fiber && guard < 100) {
                    guard += 1;
                    const props = fiber.memoizedProps;
                    if (!panelProps && props && typeof props === 'object' && Object.prototype.hasOwnProperty.call(props, 'symbolSpec') && Object.prototype.hasOwnProperty.call(props, 'symbolSpecError') && Object.prototype.hasOwnProperty.call(props, 'marketSource')) {
                      const spec = props.symbolSpec;
                      panelConnectionId = props.marketSource?.connectionId ?? null;
                      panelAccountId = props.marketSource?.accountId ?? null;
                      panelProps = {
                        symbol: String(props.symbol || ''),
                        timeframe: String(props.timeframe || ''),
                        provider: String(props.marketSource?.providerId || ''),
                        environment: String(props.marketSource?.environment || ''),
                        hasConnection: Boolean(props.marketSource?.connectionId),
                        hasAccount: Boolean(props.marketSource?.accountId),
                        specPresent: Boolean(spec),
                        specSymbol: spec?.symbol ? String(spec.symbol) : null,
                        specFields: spec ? { contractSize: spec.contractSize, pipSize: spec.pipSize, minLotSize: spec.minLotSize, maxLotSize: spec.maxLotSize, lotStep: spec.lotStep, pricePrecision: spec.pricePrecision } : null,
                        hasSpecError: Boolean(props.symbolSpecError),
                        specError: typeof props.symbolSpecError === 'string' ? props.symbolSpecError.slice(0, 240) : null,
                      };
                    }
                    let hook = fiber.memoizedState;
                    let hookIndex = 0;
                    while (hook && hookIndex < 500) {
                      const value = hook.memoizedState;
                      if (!appSpecState && value && typeof value === 'object' && Object.prototype.hasOwnProperty.call(value, 'sourceKey') && Object.prototype.hasOwnProperty.call(value, 'symbolSpec')) {
                        const parts = String(value.sourceKey || '').split('|');
                        appSpecState = {
                          ownerComponent: fiber.type?.displayName || fiber.type?.name || 'unknown',
                          hasErrorField: Object.prototype.hasOwnProperty.call(value, 'error'),
                          errorFieldType: typeof value.error,
                          storedSymbol: parts[0] || '',
                          storedProvider: parts[1] || '',
                          storedEnvironment: parts[4] || '',
                          storedKeyMatchesPanelSymbol: Boolean(panelProps && parts[0] === panelProps.symbol.trim().toUpperCase()),
                          storedKeyMatchesPanelProvider: Boolean(panelProps && parts[1] === panelProps.provider),
                          storedKeyMatchesPanelConnection: Boolean(panelProps && parts[2] === (panelConnectionId ? String(panelConnectionId) : 'no-connection')),
                          storedKeyMatchesPanelAccount: Boolean(panelProps && parts[3] === (panelAccountId ? String(panelAccountId) : 'no-account')),
                          storedKeyMatchesPanelEnvironment: Boolean(panelProps && parts[4] === (panelProps.environment || 'no-environment')),
                          storedSpecPresent: Boolean(value.symbolSpec),
                          storedSpecSymbol: value.symbolSpec?.symbol ? String(value.symbolSpec.symbol) : null,
                          hasStoredError: Boolean(value.error),
                          storedError: typeof value.error === 'string' ? value.error.slice(0, 240) : null,
                        };
                      }
                      hook = hook.next;
                      hookIndex += 1;
                    }
                    fiber = fiber.return;
                  }
                  return { fiberFound: true, panelProps, appSpecState };
                })).catch((error) => [{ error: String(error).slice(0, 500) }]);
                report.interactions = report.interactions || {};
                report.interactions[config.name] = interactionReport;
                const visibleHeadings = await page.getByRole('heading').allTextContents().catch(() => []);
                report[`${config.name}_bots_workspace`] = {
                  opened: botsOpened,
                  botHeadingVisible: /SHAFX Signal Bot/i.test(botWorkspaceText),
                  tradeBotHeadingVisible: /Trade Bot/i.test(botWorkspaceText),
                  visibleHeadings: visibleHeadings.slice(-40),
                  visibleText: botWorkspaceText.slice(-10000),
                };
              } catch (error) {
                navigationError = String(error?.stack || error).slice(0, 3000);
              }

              const title = await page.title().catch(() => '');
              const finalUrl = page.url();
              const bodyText = await page.locator('body').innerText({ timeout: 10000 }).catch(() => '');
              const rootInfo = await page.locator('#root').evaluate((element) => ({
                exists: true,
                textLength: (element.innerText || '').length,
                width: Math.round(element.getBoundingClientRect().width),
                height: Math.round(element.getBoundingClientRect().height),
              })).catch(() => ({ exists: false, textLength: 0, width: 0, height: 0 }));

              report.viewports.push({
                name: config.name,
                viewport: config.viewport,
                navigationStatus,
                navigationError,
                finalUrl,
                title,
                rootInfo,
                bodyPreview: bodyText.slice(0, 4000),
                browserErrors: browserErrors.slice(0, 80),
                pageErrors: pageErrors.slice(0, 40),
                failedRequests: failedRequests.slice(0, 80),
                badResponses: badResponses.slice(0, 80),
              });

              if (
                navigationStatus === null ||
                navigationStatus >= 500 ||
                !rootInfo.exists ||
                pageErrors.length > 0 ||
                (navigationError && !/did not reach the signed-in workspace/i.test(navigationError))
              ) {
                hasFatalIssue = true;
              }
              await context.close();
            }
          } finally {
            await browser.close();
          }

          fs.writeFileSync('qa-results/report.json', JSON.stringify(report, null, 2));
          fs.writeFileSync(
            'qa-results/report.txt',
            report.viewports.map((view) => [
              `=== ${view.name.toUpperCase()} ===`,
              `Navigation status: ${view.navigationStatus}`,
              `Final URL: ${view.finalUrl}`,
              `Title: ${view.title}`,
              `Root: ${JSON.stringify(view.rootInfo)}`,
              `Page errors: ${view.pageErrors.length}`,
              `Console errors: ${view.browserErrors.length}`,
              `Failed requests: ${view.failedRequests.length}`,
              `HTTP responses >= 400: ${view.badResponses.length}`,
              `Body preview: ${view.bodyPreview.replace(/\s+/g, ' ').slice(0, 1000)}`,
            ].join('\n')).join('\n\n'),
          );

          console.log(fs.readFileSync('qa-results/report.txt', 'utf8'));
          console.log('=== INTERACTIVE ACTION RESULTS ===');
          console.log(JSON.stringify({ interactions: report.interactions ?? {}, desktopBots: report.desktop_bots_workspace ?? null, mobileBots: report.mobile_bots_workspace ?? null }, null, 2));
          if (hasFatalIssue) process.exitCode = 1;
          NODE

      - name: Upload live interaction diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shafx-render-live-browser-check
          path: qa-results/
          if-no-files-found: warn
          retention-days: 3
